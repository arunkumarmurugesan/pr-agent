name: PR Agent
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    steps:
    - name: Checkout PR
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install PR-Agent from GitHub
      run: |
        pip install -q git+https://github.com/qodo-ai/pr-agent.git
    
    - name: Run PR-Agent Review
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python -m pr_agent.cli --pr_url=https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }} review
